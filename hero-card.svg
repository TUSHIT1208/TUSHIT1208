<svg width="850" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      /* Responsive text theme adaptation */
      .card-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1.5px;
        fill: #0F172A;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #64748B;
      }
      .code-stream {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #0EA5E9;
        opacity: 0.35;
      }
      @media (prefers-color-scheme: dark) {
        .card-name { fill: #F8FAFC; }
        .card-sub { fill: #94A3B8; }
        .code-stream { opacity: 0.5; fill: #38BDF8; }
      }

      /* Fast coding animation keyframes */
      @keyframes fastCode {
        0% { transform: translateY(0); }
        100% { transform: translateY(-160px); }
      }
      .streaming-lines {
        animation: fastCode 3.5s linear infinite;
      }
    </style>

    <!-- Translucent Sky-Blue Glass Filter -->
    <filter id="soft-glow" x="0" y="0" width="850" height="280" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="card-clip">
      <rect x="15" y="15" width="820" height="250" rx="18" />
    </clipPath>
  </defs>

  <!-- Transparent Light Sky Glass Container -->
  <rect x="15" y="15" width="820" height="250" rx="18" fill="#38BDF8" fill-opacity="0.07" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Left Side: Typography -->
  <g transform="translate(60, 0)">
    <text x="0" y="105" class="card-name">
      TUSHIT MAISURIYA
    </text>
    
    <text x="0" y="145" class="card-sub">
      <tspan x="0" dy="0">Laravel Backend Developer | PHP &amp; MySQL</tspan>
      <tspan x="0" dy="26">RESTful APIs | Database Management</tspan>
    </text>
  </g>

  <!-- Right Side: Fast Code Matrix Animation & Image Container -->
  <g clip-path="url(#card-clip)">
    <!-- Animated Streaming Code Lines Behind Image -->
    <g transform="translate(560, 40)" class="streaming-lines">
      <text x="0" y="20" class="code-stream">&lt;?php namespace App\Http\Controllers; ?&gt;</text>
      <text x="0" y="40" class="code-stream">class UserController extends Controller {</text>
      <text x="15" y="60" class="code-stream">public function buildAPI(Request $req) {</text>
      <text x="30" y="80" class="code-stream">return response()->json($query->get());</text>
      <text x="15" y="100" class="code-stream">} DB::beginTransaction();</text>
      <text x="0" y="120" class="code-stream">public function optimizeCache() {</text>
      <text x="15" y="140" class="code-stream">Cache::remember('routes', 3600, fn() => ...);</text>
      <text x="0" y="160" class="code-stream">return $kernel->handle($request);</text>
      <!-- Repeated lines for continuous loop -->
      <text x="0" y="180" class="code-stream">&lt;?php namespace App\Http\Controllers; ?&gt;</text>
      <text x="0" y="200" class="code-stream">class UserController extends Controller {</text>
      <text x="15" y="220" class="code-stream">public function buildAPI(Request $req) {</text>
      <text x="30" y="240" class="code-stream">return response()->json($query->get());</text>
      <text x="15" y="260" class="code-stream">} DB::beginTransaction();</text>
      <text x="0" y="280" class="code-stream">public function optimizeCache() {</text>
      <text x="15" y="300" class="code-stream">Cache::remember('routes', 3600, fn() => ...);</text>
    </g>

    <!-- Character Image -->
    <image xlink:href="profile-char.png" x="590" y="20" width="225" height="255" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
