<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 1.5px;
        fill: #0F172A;
      }
      .hero-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #475569;
      }
      @media (prefers-color-scheme: dark) {
        .card-fill {
          fill: #0c4a6e;
          fill-opacity: 0.22;
          stroke: #38bdf8;
          stroke-opacity: 0.35;
        }
        .hero-title {
          fill: #F8FAFC;
        }
        .hero-subtitle {
          fill: #94A3B8;
        }
      }
      @media (prefers-color-scheme: light) {
        .card-fill {
          fill: #e0f2fe;
          fill-opacity: 0.75;
          stroke: #7dd3fc;
          stroke-opacity: 0.6;
        }
      }
    </style>
  </defs>

  <!-- Sky Blue Card with Rounded Corners -->
  <rect x="5" y="5" width="840" height="250" rx="16" class="card-fill" stroke-width="1.5"/>

  <!-- Left Side: Typography -->
  <text x="55" y="105" class="hero-title">TUSHIT MAISURIYA</text>
  <text x="55" y="148" class="hero-subtitle">
    <tspan x="55" dy="0">Laravel Backend Developer | PHP &amp; MySQL</tspan>
    <tspan x="55" dy="26">RESTful APIs | Database Management</tspan>
  </text>

  <!-- Right Side: PNG Image Reference -->
  <image xlink:href="profile-char.png" x="610" y="15" width="200" height="235" preserveAspectRatio="xMidYMid meet"/>
</svg>
