<svg width="850" height="340" viewBox="0 0 850 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cat-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .cat-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #64748B;
      }

      /* Cursor blink animation */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
      }

      /* Animated code line typing */
      @keyframes codePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .pulse-line {
        animation: codePulse 2.5s ease-in-out infinite;
      }

      /* Light and Dark theme adaptation */
      @media (prefers-color-scheme: dark) {
        .card-frame {
          fill: #0284c7;
          fill-opacity: 0.12;
          stroke: #38bdf8;
          stroke-opacity: 0.35;
        }
        .cat-title { fill: #F8FAFC; }
        .cat-desc { fill: #94A3B8; }
        .monitor-bg { fill: #0B1329; }
      }
      @media (prefers-color-scheme: light) {
        .card-frame {
          fill: #e0f2fe;
          fill-opacity: 0.85;
          stroke: #7dd3fc;
          stroke-opacity: 0.6;
        }
        .cat-title { fill: #0F172A; }
        .monitor-bg { fill: #1E293B; }
      }
    </style>
  </defs>

  <!-- Clean Rounded Card (Matching Hero Card, No Tables) -->
  <rect x="5" y="5" width="840" height="330" rx="18" class="card-frame" stroke-width="1.5"/>

  <!-- Left Side: Tech Stack Details & Badges -->
  <g transform="translate(45, 18)">
    <!-- 1. Backend & Databases -->
    <text x="0" y="25" class="cat-title">Backend &amp; Databases</text>
    <text x="0" y="50" class="cat-desc">• PHP, Laravel, MySQL, RESTful APIs</text>
    <text x="0" y="72" class="cat-desc">• Eloquent ORM, Database Migrations, MVC Architecture</text>
    
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="48" height="22" rx="4" fill="#777BB4"/>
      <text x="24" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">PHP</text>
      
      <rect x="54" y="0" width="62" height="22" rx="4" fill="#FF2D20"/>
      <text x="85" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Laravel</text>
      
      <rect x="122" y="0" width="60" height="22" rx="4" fill="#4479A1"/>
      <text x="152" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">MySQL</text>
      
      <rect x="188" y="0" width="76" height="22" rx="4" fill="#0284C7"/>
      <text x="226" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">REST APIs</text>
    </g>

    <!-- 2. Frontend & Scripting -->
    <text x="0" y="142" class="cat-title">Frontend &amp; Scripting</text>
    <text x="0" y="166" class="cat-desc">• HTML5, JavaScript, Tailwind CSS, Ajax</text>
    
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#F7DF1E"/>
      <text x="38" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#000" text-anchor="middle">JavaScript</text>
      
      <rect x="82" y="0" width="86" height="22" rx="4" fill="#38B2AC"/>
      <text x="125" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Tailwind CSS</text>
      
      <rect x="174" y="0" width="56" height="22" rx="4" fill="#E34F26"/>
      <text x="202" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">HTML5</text>
      
      <rect x="236" y="0" width="46" height="22" rx="4" fill="#2563EB"/>
      <text x="259" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Ajax</text>
    </g>

    <!-- 3. DevOps & Version Control -->
    <text x="0" y="235" class="cat-title">DevOps &amp; Version Control</text>
    <text x="0" y="259" class="cat-desc">• Git, GitHub, cPanel Live Server Deployment</text>
    
    <g transform="translate(0, 271)">
      <rect x="0" y="0" width="42" height="22" rx="4" fill="#F05032"/>
      <text x="21" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Git</text>
      
      <rect x="48" y="0" width="58" height="22" rx="4" fill="#24292E"/>
      <text x="77" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">GitHub</text>
      
      <rect x="112" y="0" width="58" height="22" rx="4" fill="#FF6C2C"/>
      <text x="141" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">cPanel</text>
    </g>
  </g>

  <!-- Right Side: Native Animated Dual-Screen Coding Workspace -->
  <g transform="translate(540, 45)">
    <!-- Desk Surface -->
    <path d="M-20 220 L270 220 L250 240 L-40 240 Z" fill="#334155" opacity="0.4"/>
    
    <!-- Monitor 1 (Main IDE Screen) -->
    <rect x="20" y="20" width="165" height="115" rx="8" class="monitor-bg" stroke="#475569" stroke-width="2"/>
    <!-- Stand -->
    <rect x="94" y="135" width="18" height="35" fill="#475569"/>
    <rect x="75" y="170" width="55" height="6" rx="3" fill="#64748B"/>
    
    <!-- IDE Window Bar & Dots -->
    <rect x="20" y="20" width="165" height="18" rx="8" fill="#1E293B"/>
    <circle cx="32" cy="29" r="3" fill="#EF4444"/>
    <circle cx="42" cy="29" r="3" fill="#F59E0B"/>
    <circle cx="52" cy="29" r="3" fill="#10B981"/>

    <!-- Animated Code Syntax Lines -->
    <rect x="32" y="48" width="55" height="4" rx="2" fill="#38BDF8"/>
    <rect x="92" y="48" width="40" height="4" rx="2" fill="#F43F5E"/>
    <rect x="42" y="58" width="75" height="4" rx="2" fill="#A855F7" class="pulse-line"/>
    <rect x="42" y="68" width="95" height="4" rx="2" fill="#22C55E"/>
    <rect x="52" y="78" width="50" height="4" rx="2" fill="#F59E0B"/>
    <rect x="52" y="88" width="65" height="4" rx="2" fill="#38BDF8"/>
    <rect x="42" y="98" width="30" height="4" rx="2" fill="#A855F7"/>
    <!-- Blinking Terminal Cursor -->
    <rect x="75" y="97" width="5" height="7" fill="#38BDF8" class="cursor"/>

    <!-- Monitor 2 (Side Angled Analytics Screen) -->
    <g transform="translate(145, 10) skewY(-8) scale(0.75)">
      <rect x="0" y="0" width="115" height="135" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Header -->
      <rect x="10" y="12" width="40" height="4" rx="2" fill="#38BDF8"/>
      <!-- Analytics Bars -->
      <rect x="15" y="105" width="12" height="18" rx="2" fill="#38BDF8" opacity="0.6"/>
      <rect x="35" y="85" width="12" height="38" rx="2" fill="#38BDF8"/>
      <rect x="55" y="65" width="12" height="58" rx="2" fill="#22C55E"/>
      <rect x="75" y="45" width="12" height="78" rx="2" fill="#A855F7"/>
      <path d="M20 95 L40 75 L60 55 L80 35" stroke="#F43F5E" stroke-width="2" fill="none"/>
    </g>

    <!-- Keyboard & Mouse -->
    <polygon points="50,188 155,188 165,204 40,204" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <ellipse cx="185" cy="196" rx="8" ry="12" fill="#334155"/>
  </g>
</svg>
